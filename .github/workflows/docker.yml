# STALE since "Port headroom-hook to busbar's signed dlopen plugin ABI" (commit c37b798): this
# workflow builds a standalone `headroom-hook` BINARY for the RETIRED Unix-socket transport, but the
# crate has been `crate-type = ["cdylib", "rlib"]` only since that port — no `[[bin]]`, no `fn main`
# — so `cargo build --release` here can no longer produce a binary at all. `release.yml` is the real
# release workflow now (builds the cdylib, packs+signs it as a busbar plugin tarball).
#
# The automatic `push: tags: v*` trigger is REMOVED below so this doesn't fail on every release tag.
# Kept as `workflow_dispatch` only, and NOT deleted outright: whether to revive this as a Docker
# image build for the standalone-plugin-loaded-into-busbar use case (see busbar-headroom bundled
# image work) or retire it entirely is a product call, not made unilaterally here.
#
# Build the headroom-hook image for amd64 + arm64 and publish to Docker Hub,
# tagged with the pushed vX.Y.Z tag and `latest`. Binaries are built on
# NATIVE runners (no QEMU) then copied into a small distroless/cc image.
#
# DEPRECATED / CURRENTLY BROKEN: this workflow builds `target/<triple>/release/headroom-hook`,
# a binary that no longer exists — since "Port headroom-hook to busbar's signed dlopen plugin
# ABI" (commit c37b798) this crate is `crate-type = ["cdylib", "rlib"]` only (no `[[bin]]`, no
# `fn main`). `cargo build --release` here builds fine (the lib target), but there is no
# `headroom-hook` executable to `file`/upload/COPY into the Dockerfile — this workflow would
# fail partway through if it ran. The automatic `push: tags: v*` trigger has been REMOVED (see
# below) so it stops firing (and failing) on every release tag; `workflow_dispatch` is kept as a
# manual-only escape hatch, not deleted outright. NOTHING calls this automatically anymore:
# headroom-release-publish.yml used to `gh workflow run docker.yml` after every merge to main
# (dispatching a guaranteed-failing run on every real release, since this workflow was already
# broken) — that call was retargeted to docker-bundle.yml instead, the actual current release
# path. Use getbusbar/busbar-headroom (.github/workflows/docker-bundle.yml) instead — see
# README.md's "Two ways to run" section. Fixing or retiring this file for good is a product call
# for a human, not made unilaterally here.
#
# NOTE (see Dockerfile): on Linux, headroom-core's default tree links the ONNX
# runtime at build time. The FIRST run of this workflow is the validation point
# for the runtime linkage — if the binary needs libonnxruntime.so at run time,
# bump FROM in the Dockerfile to a base that carries it (or, better, land the
# upstream `ml`-feature gate so the lexical build drops ONNX entirely and this
# can move to a static musl binary on FROM scratch).
name: docker

on:
  workflow_dispatch: {}   # STALE — see header. No longer runs automatically on tag push.

env:
  DOCKERHUB_IMAGE: getbusbar/headroom-hook

jobs:
  # Per-arch binaries on native runners (arm64 built on arm64 — no emulation).
  build-binaries:
    name: build ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build (release)
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          BIN="target/${{ matrix.target }}/release/headroom-hook"
          file "$BIN"
          # Reveal the runtime linkage — this is the validation point for the
          # image base: if `ldd` lists libonnxruntime.so, distroless/cc needs it
          # added (or land the upstream `ml`-feature gate to drop ONNX entirely).
          echo "== ldd =="; ldd "$BIN" || true
          if ldd "$BIN" 2>/dev/null | grep -qi 'onnxruntime'; then
            echo "::warning::binary links libonnxruntime.so at runtime — distroless/cc base must provide it"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: headroom-hook-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/headroom-hook
          if-no-files-found: error

  publish:
    name: build & push image
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage binaries into build context
        uses: actions/download-artifact@v4
        with:
          pattern: headroom-hook-*
          path: staged
      - name: Arrange per-arch layout
        run: |
          mkdir -p binaries/amd64 binaries/arm64
          mv staged/headroom-hook-amd64/headroom-hook binaries/amd64/headroom-hook
          mv staged/headroom-hook-arm64/headroom-hook binaries/arm64/headroom-hook
          chmod +x binaries/amd64/headroom-hook binaries/arm64/headroom-hook

      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          VER=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
          # tag build -> X.Y.Z + latest; bare dispatch -> `test`.
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.ver.outputs.ver }},enable=${{ steps.ver.outputs.ver != '' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.ver != '' }}
            type=raw,value=test,enable=${{ steps.ver.outputs.ver == '' }}
          labels: |
            org.opencontainers.image.title=headroom-hook
            org.opencontainers.image.description=Context-compression rewrite gate for busbar (headroom-core BM25 TextCrusher).
            org.opencontainers.image.url=https://getbusbar.com/hooks/headroom
            org.opencontainers.image.licenses=Apache-2.0

      # RELEASE GATE: build the amd64 image, load it, and prove it actually RUNS and
      # COMPRESSES the compose way before we publish anything. Catches the class a
      # `cargo test` can't — a binary that builds but can't LOAD in the runtime image
      # (glibc/CXXABI) or can't CREATE its socket (volume ownership).
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: headroom-hook:smoke
          provenance: false

      - name: Docker smoke test (runs + compresses)
        run: |
          docker pull getbusbar/busbar:latest
          chmod +x scripts/docker-smoke.sh
          ./scripts/docker-smoke.sh headroom-hook:smoke getbusbar/busbar:latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
