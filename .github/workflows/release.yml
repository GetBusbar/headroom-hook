# Release: on a version tag (e.g. v1.0.0), build the headroom-hook plugin cdylib for all 5
# supported targets, pack + sign each into a loadable busbar plugin tarball, and publish them to
# THIS repo's own GitHub Release.
#
# This mirrors busbarAI/.github/workflows/release.yml's `auth-plugins` job (and the identical
# pattern GetBusbar/auth-oidc and GetBusbar/webrequest-hook use) — same 5-target matrix, same
# busbar-plugin-pack pack/sign step (built from a sibling busbar checkout), same
# BUSBAR_SIGN_KEY-or-`--allow-unsigned` fallback, same `gh release upload` + build-provenance
# attestation — just scoped to this one plugin.
#
# REPLACES the old `release-headroom` workflow, which built a standalone binary for the
# RETIRED Unix-socket transport (`headroom-hook` executable, triggered by a `headroom-v*` tag).
# Since headroom-hook became a signed dlopen plugin, this crate is
# `crate-type = ["cdylib", "rlib"]` only — no `[[bin]]`, no `fn main` — so that old workflow can no
# longer build anything. This workflow builds the cdylib instead, packed the same way every other
# first-party plugin's Release tarball is.
#
# No musl / FROM-scratch complexity here on purpose: that trickery (musl-native `rust:alpine`
# container, crt-static disabled, runtime libs extracted) is specific to the SEPARATE
# getbusbar/busbar-headroom bundled Docker image (.github/workflows/docker-bundle.yml, FROM
# scratch => no libc at all in the runtime image, so the cdylib's dynamic-link dependencies must
# be hand-carried in). A plain tarball release is not going into a from-scratch image — it loads
# into a normal glibc/libc++ busbar process on the end user's machine — so it uses the exact same
# standard 5-target matrix (glibc Linux, not musl) every other plugin's release.yml uses, with no
# special linking steps.
#
# This plugin's own version (the `v*` tag pushed here) is NOT tied to busbar's version number —
# see other first-party plugin repos for the same convention.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # kept: headroom-release-watch.yml invokes this workflow by name after a
                           # dependency-bump tag push (GITHUB_TOKEN-pushed tags don't self-trigger).

permissions:
  contents: write      # create the Release + upload assets
  id-token: write      # OIDC identity for keyless Sigstore signing (provenance)
  attestations: write  # record the build-provenance attestation

jobs:
  # ── TEST GATE ────────────────────────────────────────────────────────────────────────────────
  # Nothing is built, signed or attested until this repo's own suite passes AGAINST THE EXACT CORE
  # COMMIT THIS RELEASE WILL BUILD AGAINST.
  #
  # This was missing, and the gap was not theoretical: `ci.yml` is armed on branch pushes and PRs
  # only, so a `v*` tag event did not trigger it AT ALL, while `release-on-upstream.yml`'s cron cuts
  # those tags automatically. A signed, provenance-attested plugin could therefore ship from a
  # commit whose suite never ran in that run -- the attestation would faithfully certify the
  # provenance of an untested artifact.
  #
  # `busbar_ref` is resolved from `.busbar-ref`, NOT from the branch: the release builds against a
  # pinned core SHA, so the gate has to test against that same SHA or it is not testing what ships.
  # Testing against a moving branch instead is the other half of the same defect.
  resolve-busbar-ref:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve busbar ref from .busbar-ref
        id: ref
        run: echo "sha=$(cut -d' ' -f1 .busbar-ref)" >> "$GITHUB_OUTPUT"
        shell: bash

  gate:
    needs: resolve-busbar-ref
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@dev
    with:
      plugin_crate: headroom-hook
      plugin_kind: hook
      plugin_alias: headroom
      service: none
      busbar_ref: ${{ needs.resolve-busbar-ref.outputs.sha }}

  # Create the Release first so the parallel per-target upload jobs have something to attach to
  # (uploading from a matrix without a pre-existing release races -> "release not found").
  create-release:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "busbar-headroom ${GITHUB_REF_NAME}" \
            --verify-tag --generate-notes \
          || gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"

  # One signed .tar.gz per target: {cdylib + manifest.json}, packed by busbar-plugin-pack and
  # signed with the busbar release PRIVATE key (BUSBAR_SIGN_KEY secret) so it verifies as
  # first-party against the PUBLIC key embedded in busbar's own release binaries. If that secret
  # isn't provisioned on this repo, falls back to an UNSIGNED tarball (loadable only under
  # plugins.trust.allow_unsigned) rather than blocking the release — same seam every other
  # first-party plugin's release.yml documents.
  headroom-plugin:
    needs: create-release
    name: headroom-plugin (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            libext: so
            libprefix: lib
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            libext: so
            libprefix: lib
          - target: x86_64-apple-darwin
            os: macos-latest
            libext: dylib
            libprefix: lib
          - target: aarch64-apple-darwin
            os: macos-latest
            libext: dylib
            libprefix: lib
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            libext: dll
            libprefix: ""
    steps:
      - name: Checkout headroom-hook
        uses: actions/checkout@v7
        with:
          path: headroom-hook

      - name: Resolve busbar ref from .busbar-ref
        id: ref
        run: echo "sha=$(cut -d' ' -f1 headroom-hook/.busbar-ref)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Checkout busbar (sibling path dependency)
        uses: actions/checkout@v7
        with:
          repository: GetBusbar/busbar
          ref: ${{ steps.ref.outputs.sha }}
          path: busbarAI

      # Normalizes whatever busbarAI path this checkout's Cargo.toml carries onto the
      # sibling-relative form this job's layout produces. A no-op when the manifest already uses
      # `../busbarAI/crates/...`; .github/workflows/docker-bundle.yml carries the same step.
      - name: Patch headroom-hook's interim path dependencies for CI
        shell: bash
        run: |
          set -euo pipefail
          sed -i.bak -E 's#path = "[^"]*/busbarAI/crates#path = "../busbarAI/crates#g' headroom-hook/Cargo.toml
          rm -f headroom-hook/Cargo.toml.bak
          grep 'path = "\.\./busbarAI' headroom-hook/Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build the headroom-hook plugin cdylib
        working-directory: headroom-hook
        run: cargo build --release --lib --target ${{ matrix.target }}
        shell: bash

      - name: Build busbar-plugin-pack (from the sibling busbar checkout)
        working-directory: busbarAI
        run: cargo build --release --target ${{ matrix.target }} -p busbar-plugin-pack
        shell: bash

      - name: Package + sign the plugin tarball
        env:
          BUSBAR_SIGN_KEY: ${{ secrets.BUSBAR_SIGN_KEY }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          outdir="plugin-dist"; mkdir -p "$outdir"
          pack="busbarAI/target/${target}/release/busbar-plugin-pack"
          [ -x "$pack" ] || pack="busbarAI/target/${target}/release/busbar-plugin-pack.exe"
          unsigned_flag=""
          if [ -z "${BUSBAR_SIGN_KEY:-}" ]; then
            echo "::warning::BUSBAR_SIGN_KEY secret is not provisioned — packaging an UNSIGNED plugin tarball (loadable only under plugins.trust.allow_unsigned). See busbarAI's release.yml TODO(release-keys) seam."
            unsigned_flag="--allow-unsigned"
          fi
          lib="headroom-hook/target/${target}/release/${{ matrix.libprefix }}headroom_hook.${{ matrix.libext }}"
          "$pack" pack \
            --lib "$lib" \
            --name "busbar-headroom" --alias "headroom" --kind hook \
            --version "$ver" --publisher busbar \
            --description "Compresses LLM chat history with the real headroom-core BM25 TextCrusher engine as a prompt:rw rewrite gate — a busbar first-party kind:hook plugin (dlopen cdylib)." \
            --license Apache-2.0 \
            --needs-prompt rw \
            --out "${outdir}/busbar-headroom-${ver}-${target}.tar.gz" \
            $unsigned_flag
          ls -l "$outdir"
        shell: bash

      - name: Attach plugin tarball to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" plugin-dist/*.tar.gz --repo "${GITHUB_REPOSITORY}" --clobber
        shell: bash

      # Keyless (Sigstore/OIDC) build-provenance attestation binding this tarball's digest to this
      # workflow run + commit — `gh attestation verify <tarball> --repo ${{ github.repository }}`.
      - name: Attest plugin build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "plugin-dist/*.tar.gz"

  # PHANTOM-RELEASE GUARD: assert the published Release actually carries assets before we treat this
  # as a real release. The per-target build/upload jobs run with fail-fast:false, and `create-release`
  # always makes the (initially empty) Release up front — so a build/pack failure on EVERY target
  # (e.g. a stale Cargo.lock tripping `--locked`) leaves a tag + Release with ZERO assets: a "phantom"
  # that silently breaks busbar's plugin-registry-gate. This job fails the whole release run loud if
  # assets == 0, so a phantom can never ship (or notify downstream) unnoticed. It depends on the build
  # matrix but does NOT inherit its fail-fast:false — one green target is enough to have assets, but
  # zero across the board must hard-fail here.
  verify-assets:
    needs: [headroom-plugin]
    runs-on: ubuntu-latest
    steps:
      - name: Assert the Release has at least one asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          count="$(gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets | length')"
          echo "Release ${GITHUB_REF_NAME} has ${count} asset(s)."
          if [ "${count}" -eq 0 ]; then
            echo "::error::PHANTOM RELEASE: ${GITHUB_REF_NAME} was published with 0 assets." \
                 "Every build/pack target failed to upload a tarball. Failing the release run so this" \
                 "tag is not mistaken for a real release by busbar's plugin-registry-gate. Fix the" \
                 "build (check Cargo.lock freshness vs --locked and the plugin cdylib build step)," \
                 "delete this tag+release, and re-cut." >&2
            exit 1
          fi

  # Instant marketing-site rebuild the moment this plugin ships a real release -- marketing's
  # deploy.yml listens for this exact repository_dispatch event type (plus its own daily-poll
  # fallback, so a missed/failed dispatch here is never a permanent gap). Same RELEASE_DISPATCH_TOKEN
  # pattern busbar core's own release.yml uses for its downstream fan-out -- see that file's
  # notify-downstream job for the template this mirrors. Fails loud (not a silent no-op) if the
  # secret isn't provisioned, so a missing secret can't masquerade as "nothing to notify."
  notify-marketing:
    needs: [headroom-plugin, verify-assets]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch upstream-release to the marketing site
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASE_DISPATCH_TOKEN is not provisioned on this repo -- cannot notify" \
                 "marketing instantly. marketing's own daily poll will still pick this release up" \
                 "within 24h (self-healing fallback intact)." >&2
            exit 1
          fi
          gh api "repos/GetBusbar/marketing/dispatches" \
            -f event_type=upstream-release \
            -f "client_payload[repo]=${GITHUB_REPOSITORY}" \
            -f "client_payload[tag]=${GITHUB_REF_NAME}"
