# Minimal busbar config for a Headroom trial. Registers the Headroom compression hook on every
# request + one pool over Anthropic. The busbar image ships the vetted provider catalog, so you
# only name the provider and give it a key via the environment. Swap the provider/model for
# whatever you use — busbar speaks all six protocols.
#
# Headroom is a signed `dlopen` plugin busbar loads IN-PROCESS: there is no hook container and no
# Unix socket (that transport is retired, along with docker-compose.yml). Drop the signed tarball
# into `plugins.dir` and reference it by `module:` from a named hook, as below. See README.md
# "Install and run" / "Wire into busbar" and bench/config.hook.yaml (a working example from this
# repo's own benchmark harness).
listen: "0.0.0.0:8080"

# Plugin instances are DEFINED ONCE here and REFERENCED BY BARE NAME from attach points.
hooks:
  headroom:
    module: busbar-headroom
    kind: gate
    prompt: rw            # the rewrite grant
    timeout_ms: 25        # ~550 µs typical; 25 ms is generous headroom
    on_error: nothing     # a broken compressor never touches a request

plugins:
  enabled: true
  dir: /etc/busbar/plugins   # or wherever you dropped the tarball

providers:
  anthropic:
    api_key: { env: ANTHROPIC_KEY }

models:
  claude:
    provider: anthropic
    max_concurrent: 10
    upstream_model: claude-3-5-sonnet-20241022

pools:
  hooks: [headroom]       # the all-pools attach: compress every request
  default:
    members:
      - model: claude
        weight: 1
