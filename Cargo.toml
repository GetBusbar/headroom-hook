[package]
name = "headroom-hook"
version = "2.0.9"
edition = "2024"
publish = false
description = "busbar first-party kind:hook plugin (dlopen cdylib): compresses LLM chat history with the real headroom-core BM25 TextCrusher engine as a prompt:rw rewrite gate."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# headroom-core with `default-features = false` — the lexical (BM25 TextCrusher) build, with the
# ONNX stack (ort/fastembed/magika) feature-gated OUT. This hook only needs TextCrusher, so the
# lexical build is ~7x smaller (29MB -> ~3MB) and avoids the ONNX-in-distroless slow path. The
# `ml`-feature gate landed UPSTREAM in headroomlabs-ai/headroom#2165 (merged 2026-07-15), so we pin
# to the upstream merge commit — the fork is retired. The gate is not in a release yet (latest is
# v0.31.0, pre-merge); the docker CI (see .github/workflows/headroom-release-watch.yml) re-pins to
# the first upstream RELEASE tag that contains the gate and rebuilds. The pin protects builds.
headroom-core = { git = "https://github.com/headroomlabs-ai/headroom", tag = "v0.35.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# INTERIM: busbarAI isn't public yet, so this is a local path dependency into a sibling checkout of
# the monorepo. Once busbarAI ships publicly this should become a git (pinned rev/tag) or crates.io
# dependency instead — same relative-path convention webrequest-hook's busbar-plugin-sdk dependency
# already uses.
busbar-plugin-sdk = { path = "../busbarAI/crates/plugin-sdk" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
busbar-plugin-loader = { path = "../busbarAI/crates/plugin-loader" }
busbar-api = { path = "../busbarAI/crates/api" }
# Dev-only: the real-admin-API e2e test builds+drives an actual `busbar` process over HTTP (install
# a signed plugin tarball via POST /api/v1/admin/plugins, mint a key, drive a real chat completion)
# — a blocking client keeps that test synchronous, no tokio runtime needed. Same major version
# busbarAI's own `busbar` crate pins, rustls-tls only, mirroring its trimmed feature set.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Dev-only: base64-encodes the packed tarball into POST /api/v1/admin/plugins's JSON body.
base64 = "0.22"
# Dev-only: a tiny synchronous HTTP server standing in for the upstream provider, so the e2e test can
# capture the exact request body busbar forwarded (proving the compression actually landed on the
# wire), without needing a whole axum/tokio server stack in a blocking test.
tiny_http = "0.12"
