# Codecov is INFORMATIONAL here, never a gate. The correctness gate is CI's `ci` job (the canonical
# plugin-ci build/test/signoff pipeline); coverage is an observation surfaced on the README badge and
# as per-PR context. So:
#   * status.*.informational: true  → Codecov posts a check for visibility but it is NEVER "failing",
#     so it can never block a PR or turn a branch red over a coverage delta.
#   * comment: false                → no bot comments on PRs; the signal lives on the badge + the
#     Codecov UI, keeping PRs seamless.
#   * ignore                        → exclude test-only / bench / non-product paths so the reported
#     percentage reflects the shipped hook, not fixtures and benchmarks.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment: false

ignore:
  - "tests"
  - "src/tests"
  - "bench"
