# Baseline: busbar alone, no Headroom plugin loaded at all (plugins block omitted). Server-Timing
# is on so the driver reads busbar;dur. Compare against config.hook.yaml, which is IDENTICAL to
# this file plus the `plugins:` block, the top-level `hooks:` definition, and the reserved
# `pools.hooks:` attach that wires Headroom in.
listen: "0.0.0.0:8080"
auth: { chain: [] }
providers: { mock: { api_key: { env: BENCH_MOCK_KEY } } }
models: { bench-model: { provider: mock, max_concurrent: 256 } }
pools: { bench-pool: { members: [ { model: bench-model } ] } }
# busbar 1.5.3 DELETED the top-level `observability:` block; the Server-Timing header the bench
# driver reads busbar's own added latency from is now an opt-in under `advanced.response_headers`.
advanced:
  response_headers:
    server_timing: true
